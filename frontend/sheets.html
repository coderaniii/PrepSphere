<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sheets - PrepSphere</title>
  <link rel="stylesheet" href="sheets.css" />
</head>

<body>

  <header>
    <h1>Sheets</h1>
  </header>

  <main class="grid">

    <div class="card" onclick="openSheet('striver')">
      <h2>Striver A2Z Sheet</h2>
      <p>Most comprehensive DSA sheet</p>
    </div>

    <div class="card" onclick="openSheet('neetcode')">
      <h2>Neetcode 150</h2>
      <p>Top interview questions</p>
    </div>

    <div class="card" onclick="openSheet('blind')">
      <h2>Blind 75</h2>
      <p>Must-do interview problems</p>
    </div>

    <div class="card" onclick="openSheet('babbar')">
      <h2>Love Babbar Sheet</h2>
      <p>Structured placement prep</p>
    </div>

  </main>

  <script src="sheets.js"></script>

</body>
</html>
